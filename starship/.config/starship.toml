# version: 1.0.0
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
continuation_prompt = "[▸▹ ](dimmed white)"

format = """$username[ in ](italic dimmed white)${custom.dir} $nix_shell$container$fill$git_branch$git_commit$git_state${custom.worktree}$git_status$git_metrics
$localip\
$shlvl\
$shell\
$env_var\
$jobs\
$sudo\
$character"""

right_format = """
$singularity\
$kubernetes\
$vcsh\
$fossil_branch\
$hg_branch\
$pijul_channel\
$docker_context\
$package\
$c\
$cpp\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$maven\
$nim\
$nodejs\
$bun\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$vlang\
$vagrant\
$xmake\
$zig\
$buf\
$conda\
$pixi\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$crystal\
$custom\
$status\
$os\
$battery\
$cmd_duration\
$time"""

[fill]
symbol = ' '

[character]
# Same small-triangle family as the git line's ▴/▿ and the ▸▹ continuation
# prompt; a failed command turns it hollow as well as red.
success_symbol = "[▸](bold green)"
error_symbol = "[▹](bold red)"
vimcmd_symbol = "[◂](bold green)"

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = 'green italic'

[sudo]
format = "[$symbol]($style)"
style = "bold italic bright-purple"
symbol = "sudo "
disabled = false

[custom.dir]
# Current folder name only, capped at 20 characters; ~ at home. Replaces the
# built-in directory module, which can't cap by characters.
command = 'd=${PWD##*/}; [ "$PWD" = "$HOME" ] && d="~"; [ ${#d} -gt 20 ] && d="${d:0:19}…"; printf %s "$d"'
when = true
shell = ["bash", "--noprofile", "--norc"]
style = "italic blue"
format = "[$output]($style)"

[cmd_duration]
format = "[ $duration](italic white)"

[jobs]
format = "[$symbol$number]($style) "
style = "white"
symbol = "[▶](blue italic)"

[localip]
ssh_only = true
format = " ◯[$localipv4](bold magenta)"
disabled = false

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic dimmed white"

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](italic bold green)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"

[[battery.display]]
threshold = 20
style = "italic bold red"

[[battery.display]]
threshold = 60
style = "italic dimmed bright-purple"

[[battery.display]]
threshold = 70
style = "italic dimmed yellow"

[git_branch]
format = "[$branch(:$remote_branch)]($style) "
symbol = "[△](bold italic bright-blue)"
style = "italic bright-blue"
truncation_symbol = "⋯"
truncation_length = 40
only_attached = true

[git_metrics]
format = '([▴$added ]($added_style))([▿$deleted]($deleted_style))'
added_style = 'italic green'
deleted_style = 'italic red'
ignore_submodules = true
disabled = false

[git_status]
# Shape + count, on the line above the prompt next to git_metrics's ▴/▿ line
# counts. ● modified, ◌ untracked, ▪ staged, ✕ deleted, ◎ renamed,
# ◪ conflicted, ⇡/⇣ ahead/behind. Stashes are not shown.
style = "italic"
format = '([$conflicted$staged$modified$renamed$deleted$untracked$ahead_behind]($style))'
conflicted = "[◪${count} ](italic bright-magenta)"
staged = "[▪${count} ](italic bright-cyan)"
modified = "[●${count} ](italic yellow)"
renamed = "[◎${count} ](italic bright-blue)"
deleted = "[✕${count} ](italic red)"
untracked = "[◌${count} ](italic bright-yellow)"
stashed = ""
ahead = "[⇡${count} ](italic green)"
behind = "[⇣${count} ](italic red)"
diverged = "[⇡${ahead_count}⇣${behind_count} ](italic bright-magenta)"

[deno]
format = " [deno](italic) [∫ $version](green bold)"
version_format = "${raw}"

[lua]
format = " [lua](italic) [${symbol}${version}]($style)"
version_format = "${raw}"
symbol = "⨀ "
style = "bold bright-yellow"

[nodejs]
format = " [node](italic) [◫ ($version)](bold bright-green)"
version_format = "${raw}"
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
detect_extensions = []

[bun]
format = " [bun](italic) [◫ ($version)](bold bright-green)"
version_format = "${raw}"

[python]
format = " [py](italic) [${symbol}${version}]($style)"
symbol = "[⌉](bold bright-blue)⌊ "
version_format = "${raw}"
style = "bold bright-yellow"

[ruby]
format = " [rb](italic) [${symbol}${version}]($style)"
symbol = "◆ "
version_format = "${raw}"
style = "bold red"

[rust]
format = " [rs](italic) [$symbol$version]($style)"
symbol = "⊃ "
version_format = "${raw}"
style = "bold red"

[package]
format = " [pkg](italic dimmed) [$symbol$version]($style)"
version_format = "${raw}"
symbol = "◨ "
style = "dimmed yellow italic bold"

[swift]
format = " [sw](italic) [${symbol}${version}]($style)"
symbol = "◁ "
style = "bold bright-red"
version_format = "${raw}"

[aws]
disabled = true
format = " [aws](italic) [$symbol $profile $region]($style)"
style = "bold blue"
symbol = "▲ "

[buf]
symbol = "■ "
format = " [buf](italic) [$symbol $version $buf_version]($style)"

[c]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[cpp]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[conda]
symbol = "◯ "
format = " conda [$symbol$environment]($style)"

[pixi]
symbol = "■ "
format = " pixi [$symbol$version ($environment )]($style)"

[dart]
symbol = "◁◅ "
format = " dart [$symbol($version )]($style)"

[docker_context]
symbol = "◧ "
format = " docker [$symbol$context]($style)"

[elixir]
symbol = "△ "
format = " exs [$symbol $version OTP $otp_version ]($style)"

[elm]
symbol = "◩ "
format = " elm [$symbol($version )]($style)"

[golang]
symbol = "∩ "
format = " go [$symbol($version )]($style)"

[haskell]
symbol = "❯λ "
format = " hs [$symbol($version )]($style)"

[java]
symbol = "∪ "
format = " java [${symbol}(${version} )]($style)"

[jj_bookmark]
format = " [$symbol$bookmark(@$remote)$diverged( \\(+$overflow_count others\\))]($style)"
symbol = "[△](bold italic bright-blue)"
style = "italic bright-blue"
truncation_symbol = "⋯"
truncation_length = 11
ignore_names = ["main", "master"]

[jj_metrics]
format = '([▴$added]($added_style))([▿$deleted]($deleted_style))'
added_style = 'italic dimmed green'
deleted_style = 'italic dimmed red'

[jj_status]
format = "([⎪$all⎥]($style))"
style = "bold italic bright-blue"
conflicted = "[◪◦](italic bright-magenta)"
description_empty = "[◌◦](italic bright-magenta)"
description_present = "[◦](italic bright-magenta)"
hidden = "[󰘓◦](italic bright-magenta)"
immutable = "[◦](italic bright-magenta)"
added = "[▪](italic bright-cyan)"
copied = "[◃◈](italic white)"
deleted = "[✕](italic red)"
modified = "[●◦](italic yellow)"
renamed = "[◎◦](italic bright-blue)"

[julia]
symbol = "◎ "
format = " jl [$symbol($version )]($style)"

[memory_usage]
symbol = "▪▫▪ "
format = " mem [${ram}( ${swap})]($style)"

[nim]
symbol = "▴▲▴ "
format = " nim [$symbol($version )]($style)"

[nix_shell]
style = 'bold italic dimmed blue'
symbol = '✶'
format = '[$symbol nix⎪$state⎪]($style) [$name](italic dimmed white)'
impure_msg = '[⌽](bold dimmed red)'
pure_msg = '[⌾](bold dimmed green)'
unknown_msg = '[◌](bold dimmed yellow)'

[spack]
symbol = "◇ "
format = " spack [$symbol$environment]($style)"

[custom.worktree]
# Name of the linked git worktree, when in one: walks up to the nearest .git
# and checks whether it's a worktree pointer file. Shell builtins only.
command = 'd=$PWD; while :; do if [ -f "$d/.git" ]; then read -r l < "$d/.git"; [[ $l == */worktrees/* ]] && printf %s "${d##*/}"; exit; fi; [ -d "$d/.git" ] && exit; [ -z "$d" ] && exit; d=${d%/*}; done'
when = true
require_repo = true
shell = ["bash", "--noprofile", "--norc"]
style = "italic bright-magenta"
format = "([⧉ $output]($style) )"

[username]
# Always shown, top-left before the folder: "goorie in .dotfiles".
show_always = true
style_user = "italic bright-yellow"
style_root = "bold italic purple"
format = "[$user]($style)"
