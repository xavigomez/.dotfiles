# herdr configuration — active settings only.
# Defaults and full option docs live in herdr's own template and
# https://herdr.dev — only deviations from defaults belong here.

onboarding = false

[theme]
# Matches ghostty's TokyoNight Moon (see README Theming).
name = "tokyo-night"

[keys]
# tmux muscle-memory ports. Unlisted actions use herdr defaults
# (prefix+w workspace picker, prefix+z zoom, prefix+v split).
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
new_workspace = "prefix+shift+w"
rename_workspace = "prefix+$"
rename_tab = "prefix+,"

# Session navigator on tmux's choose-tree key. Settings move to shift+s
# so they don't collide — herdr defaults both goto and settings to prefix+s.
goto = "prefix+s"
settings = "prefix+shift+s"

# Prefix-free pane navigation on herdr's docs-recommended ctrl+alt family:
# herdr intercepts it before pane apps, so it works from everywhere — shells,
# agent TUIs, even from inside nvim as a jump-out. Plain ctrl+hjkl stays free
# for nvim (see nvim/.config/nvim/lua/config/herdr-navigator.lua), which
# hands off to herdr at its splits' edges.
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]

# Same keys for workspace navigation while the navigate picker is open.
navigate_workspace_up = "ctrl+k"
navigate_workspace_down = "ctrl+j"

split_vertical = "prefix+|"

[ui]
# Show detected agent names (claude, pi, opencode…) on pane borders.
show_agent_labels_on_pane_borders = true

[ui.sound]
# Alert sounds when background agents need attention or finish.
enabled = true

[session]
# Agent panes resume their native conversation sessions after a server
# restart. The reporting hooks are herdr-managed (see install.sh).
resume_agents_on_restore = true

[experimental]
# Evaluated, declined: no scrollback persistence across server restarts.
pane_history = false
