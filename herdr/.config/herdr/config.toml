# =============================================================================
#  Herdr config
# =============================================================================
#
#  Replaces the old tmux + tmux-resurrect + tmux_picker.lua setup.
#  - catppuccin theme matches the previous tmux/nvim palette.
#  - resume_agents_on_restore is the native replacement for the old
#    @resurrect-processes allowlist that re-launched claude/opencode/pi
#    with --continue. Herdr knows those agents natively, no allowlist needed.
#  - Sound is off (shared/work machine).
#
#  Generate the full default config with:  herdr --default-config
#  Reload after edits:                      herdr server reload-config
#
#  Docs: https://herdr.dev/docs/configuration/

onboarding = false

[theme]
name = "catppuccin"

[session]
resume_agents_on_restore = true

[ui.sound]
enabled = false
